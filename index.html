<title>بيوت جدة — نموذج التسجيل</title>

<style>
  :root{
    --ink:#1E2A28;
    --sand:#F1EADA;
    --sand-deep:#E4D9C0;
    --teal:#1F3A3D;
    --teal-light:#33565A;
    --gold:#B8905A;
    --rose:#B4626B;
    --line:#CDBF9E;
    --white:#FFFCF6;
    --error:#A13D3D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'IBM Plex Sans Arabic', sans-serif;
    background:var(--sand);
    color:var(--ink);
    min-height:100vh;
    padding:24px 16px 60px;
  }
  .wrap{max-width:640px;margin:0 auto;}

  .mark{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px;}
  .mark svg{width:34px;height:34px;flex-shrink:0;}
  .brand{font-family:'Amiri', serif;font-weight:700;font-size:28px;color:var(--teal);text-align:center;letter-spacing:0.5px;}
  .tagline{text-align:center;color:var(--teal-light);font-size:14px;margin-bottom:28px;opacity:0.85;}
  .slogan{text-align:center;font-family:'Amiri', serif;font-style:italic;color:var(--gold);font-size:15px;margin:0 0 4px;}

  .progress-row{display:flex;gap:5px;margin-bottom:28px;padding:0 4px;flex-wrap:wrap;}
  .progress-seg{height:4px;flex:1;min-width:14px;background:var(--line);border-radius:3px;overflow:hidden;}
  .progress-seg > i{display:block;height:100%;width:0%;background:var(--gold);transition:width .4s ease;}

  .card{background:var(--white);border:1px solid var(--line);border-radius:4px;padding:32px 28px;position:relative;}
  .card::before{content:"";position:absolute;top:0;right:0;left:0;height:3px;background:linear-gradient(90deg, var(--gold), var(--rose));}

  .step-label{font-size:13px;color:var(--gold);font-weight:600;margin-bottom:6px;}
  h2.q-title{font-family:'Amiri', serif;font-size:22px;font-weight:700;color:var(--teal);margin:0 0 22px;line-height:1.5;}

  .field{margin-bottom:20px;}
  .field label{display:block;font-size:14.5px;font-weight:600;color:var(--ink);margin-bottom:8px;}
  .hint{font-size:12.5px;color:#7A7264;margin-top:5px;line-height:1.6;}
  .counter{font-size:11.5px;color:#9A907C;margin-top:4px;text-align:left;}
  input[type=text], input[type=tel], input[type=number], input[type=date], select, textarea{
    width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:3px;
    font-family:inherit;font-size:15px;color:var(--ink);background:var(--sand);
  }
  textarea{resize:vertical;min-height:80px;}
  input:focus, select:focus, textarea:focus{outline:none;border-color:var(--teal);background:var(--white);}

  .choices{display:flex;flex-wrap:wrap;gap:8px;}
  .choice{border:1px solid var(--line);background:var(--sand);padding:10px 16px;border-radius:20px;font-size:14px;cursor:pointer;user-select:none;transition:all .15s ease;}
  .choice:hover{border-color:var(--gold);}
  .choice.sel{background:var(--teal);border-color:var(--teal);color:var(--white);}

  .nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:28px;}
  button{font-family:inherit;font-size:15px;font-weight:600;border:none;border-radius:3px;padding:13px 26px;cursor:pointer;transition:opacity .15s ease;}
  button:disabled{opacity:0.4;cursor:not-allowed;}
  .btn-next{background:var(--teal);color:var(--white);}
  .btn-next:hover:not(:disabled){opacity:0.9;}
  .btn-back{background:transparent;color:var(--teal-light);padding:13px 10px;}
  .btn-back:hover{text-decoration:underline;}

  .err{color:var(--error);font-size:13px;margin-top:6px;display:none;}
  .field.has-err .err{display:block;}
  .field.has-err > input, .field.has-err > select, .field.has-err > textarea{border-color:var(--error);}
  .field.has-err .choices{outline:1px solid var(--error);border-radius:20px;}

  .success{text-align:center;padding:20px 6px;}
  .success .icon{width:60px;height:60px;border-radius:50%;background:var(--teal);color:var(--white);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 18px;}
  .success h2{font-family:'Amiri',serif;color:var(--teal);font-size:24px;margin-bottom:10px;}
  .success p{color:#5B554A;line-height:1.8;font-size:15px;}

  .admin-link{text-align:center;margin-top:24px;font-size:12.5px;color:#9A907C;}
  .admin-link a{color:#9A907C;cursor:pointer;text-decoration:underline;}
  .admin-panel{margin-top:16px;}
  .card-badge{display:inline-block;font-size:11px;background:var(--sand-deep);color:var(--teal);padding:2px 8px;border-radius:10px;margin-right:6px;font-weight:600;vertical-align:middle;}
  .id-card{border:1.5px dashed var(--gold);border-radius:8px;padding:20px;margin-top:10px;background:var(--sand);}
  .id-card .num{font-family:'Amiri',serif;font-size:26px;color:var(--teal);font-weight:700;text-align:center;margin-bottom:14px;letter-spacing:1px;}
  .id-card .row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .id-card .row span:first-child{color:#7A7264;}
  .id-card .row span:last-child{font-weight:600;text-align:left;}

  .intro-card{background:var(--white);border:1px solid var(--line);border-radius:4px;padding:26px 24px;position:relative;margin-bottom:16px;}
  .intro-card::before{content:"";position:absolute;top:0;right:0;left:0;height:3px;background:linear-gradient(90deg, var(--gold), var(--rose));}
  .verse{font-family:'Amiri', serif;font-size:18px;line-height:2.1;color:var(--teal);text-align:center;margin:0 0 6px;}
  .verse-ref{text-align:center;font-size:12.5px;color:var(--gold);margin-bottom:22px;}
  .motto{text-align:center;font-family:'Amiri', serif;font-size:17px;color:var(--rose);margin:4px 0;}
  .motto-sub{text-align:center;font-size:13.5px;color:#5B554A;line-height:1.9;margin-bottom:22px;}
  .steps-title{font-weight:700;color:var(--teal);font-size:15px;margin:22px 0 12px;}
  .steps-list{margin:0;padding:0;list-style:none;counter-reset:step;}
  .steps-list li{counter-increment:step;position:relative;padding:8px 0 8px 0;padding-right:34px;font-size:13.5px;line-height:1.8;border-bottom:1px solid var(--line);}
  .steps-list li:last-child{border-bottom:none;}
  .steps-list li::before{content:counter(step);position:absolute;right:0;top:8px;width:22px;height:22px;background:var(--teal);color:var(--white);border-radius:50%;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700;}
  .source-note{text-align:center;font-size:11px;color:#9A907C;margin-top:6px;}
  .btn-start{display:block;width:100%;margin-top:26px;}
  .ornament{text-align:center;color:var(--gold);font-size:18px;letter-spacing:14px;margin-bottom:16px;}
  .flowing-text{font-size:15.5px;line-height:2.1;color:var(--ink);text-align:center;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  th,td{border:1px solid var(--line);padding:6px 8px;text-align:right;vertical-align:top;white-space:nowrap;}
  th{background:var(--sand-deep);}
  .adm-bar{display:flex;gap:8px;margin-bottom:14px;}
</style>
</head>

let current = 0;
let answers = {};
let previewMode = false;



function checkOne(cond){
  const val = answers[cond.f];
  if(cond.eq !== undefined) return val === cond.eq;
  if(cond.not !== undefined) return val !== undefined && val !== null && val !== '' && val !== cond.not;
  if(cond.notIn !== undefined) return val !== undefined && val !== null && val !== '' && !cond.notIn.includes(val);
  if(cond.in !== undefined) return cond.in.includes(val);
  if(cond.includes !== undefined) return Array.isArray(val) && val.includes(cond.includes);
  return true;
}
function evalCondition(cond){
  if(!cond) return true;
  if(typeof cond === 'function') return cond();
  if(Array.isArray(cond)) return cond.every(checkOne);
  return checkOne(cond);
}
function pruneHiddenAnswers(){
  steps.forEach(step=>{
    step.fields.forEach(f=>{
      if(f.showIf && answers[f.id] !== undefined && !evalCondition(f.showIf)){
        delete answers[f.id];
      }
    });
  });
}

function visibleFields(step){ return step.fields.filter(f => evalCondition(f.showIf)); }

function renderProgress(){
  const row = document.getElementById('progressRow');
  row.innerHTML = '';
  steps.forEach((s,i)=>{
    const seg = document.createElement('div');
    seg.className='progress-seg';
    const bar = document.createElement('i');
    bar.style.width = i < current ? '100%' : (i === current ? '50%' : '0%');
    seg.appendChild(bar);
    row.appendChild(seg);
  });
}

function fieldHTML(f){
  const val = answers[f.id];
  const opts = typeof f.options === 'function' ? f.options() : f.options;
  let inner = '';
  if(f.type === 'choice'){
    inner = `<div class="choices" data-field="${f.id}">` +
      opts.map(o => `<div class="choice ${val===o?'sel':''}" data-val="${o}">${o}</div>`).join('') + `</div>`;
  } else if(f.type === 'multichoice'){
    const arr = Array.isArray(val) ? val : [];
    inner = `<div class="choices" data-field="${f.id}" data-multi="1">` +
      opts.map(o => `<div class="choice ${arr.includes(o)?'sel':''}" data-val="${o}">${o}</div>`).join('') + `</div>`;
  } else if(f.type === 'textarea'){
    inner = `<textarea data-field="${f.id}" ${f.maxlength?`maxlength="${f.maxlength}"`:''}>${val||''}</textarea>` +
      (f.maxlength ? `<div class="counter" id="counter-${f.id}">${(val||'').length}/${f.maxlength}</div>` : '');
  } else {
    inner = `<input type="${f.type}" data-field="${f.id}" value="${val||''}">`;
  }
  return `<div class="field" id="field-${f.id}">
    ${f.label ? `<label>${f.label} ${f.onCard ? '<span class="card-badge">🪪 يظهر في البطاقة</span>' : ''}</label>` : ''}
    ${inner}
    ${f.hint ? `<div class="hint">${f.hint}</div>` : ''}
    <div class="err">هذا الحقل مطلوب</div>
  </div>`;
}

function renderStep(){
  renderProgress();
  const step = steps[current];
  const fields = visibleFields(step);
  const card = document.getElementById('cardArea');
  card.innerHTML = `
    <div class="step-label">خطوة ${current+1} من ${steps.length}</div>
    <h2 class="q-title">${step.title}</h2>
    <div id="fieldsHost">${fields.map(fieldHTML).join('')}</div>
    <div class="nav-row">
      ${current>0 ? `<button class="btn-back" id="backBtn">رجوع</button>` : `<span></span>`}
      <button class="btn-next" id="nextBtn">${current===steps.length-1?'إرسال الطلب':'التالي'}</button>
    </div>`;

  card.querySelectorAll('.choices').forEach(group=>{
    group.addEventListener('click', e=>{
      const chip = e.target.closest('.choice');
      if(!chip) return;
      const fieldId = group.dataset.field;
      if(group.dataset.multi){
        let arr = Array.isArray(answers[fieldId]) ? answers[fieldId].slice() : [];
        const v = chip.dataset.val;
        if(arr.includes(v)) arr = arr.filter(x=>x!==v); else arr.push(v);
        answers[fieldId] = arr;
      } else {
        answers[fieldId] = chip.dataset.val;
      }
      document.getElementById('field-'+fieldId).classList.remove('has-err');
      pruneHiddenAnswers();
      renderStep();
    });
  });

  card.querySelectorAll('input[data-field], textarea[data-field]').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const fid = e.target.dataset.field;
      answers[fid] = e.target.value;
      clearFieldError(fid);
      const counter = document.getElementById('counter-'+fid);
      if(counter) counter.textContent = e.target.value.length + '/' + e.target.getAttribute('maxlength');
    });
  });

  const backBtn = document.getElementById('backBtn');
  if(backBtn) backBtn.addEventListener('click', ()=>{ current--; renderStep(); });
  document.getElementById('nextBtn').addEventListener('click', onNext);
}

function setFieldError(fid, msg){
  const field = document.getElementById('field-'+fid);
  field.classList.add('has-err');
  const errEl = field.querySelector('.err');
  errEl.textContent = msg;
}
function clearFieldError(fid){
  const field = document.getElementById('field-'+fid);
  field.classList.remove('has-err');
  const errEl = field.querySelector('.err');
  errEl.textContent = 'هذا الحقل مطلوب';
}

function onNext(){
  const step = steps[current];
  const fields = visibleFields(step);
  if(!previewMode){
    let ok = true;
    fields.forEach(f=>{
      const v = answers[f.id];
      const empty = f.type === 'multichoice' ? !(Array.isArray(v) && v.length) : !v;
      if(f.required && empty){
        setFieldError(f.id, 'هذا الحقل مطلوب');
        ok = false;
      } else if(f.type === 'tel' && v){
        const digits = String(v).replace(/[^0-9]/g,'');
        if(digits.length !== 10){
          setFieldError(f.id, 'رقم الجوال غلط، يجب أن يتكون من 10 أرقام');
          ok = false;
        }
      }
    });
    if(!ok) return;
  }
  if(!previewMode && step.key === 'eligibility' && answers.eligibleSaudiJeddah === 'لا'){
    showIneligible('نعتذر، خدمة بيوت جدة مخصصة حاليًا للسعوديين والسعوديات المقيمين في مدينة جدة فقط. نشكر لك اهتمامك، ونتمنى لك التوفيق.');
    return;
  }
  if(!previewMode && step.key === 'submitter' && answers.onBehalfConsent === 'لا'){
    showIneligible('نعتذر عن عدم إكمال الطلب. لا يمكن قبول طلب تقديم نيابة عن شخص آخر دون علمه وموافقته الصريحة.');
    return;
  }
  if(current === steps.length-1){ submitForm(); } else { current++; renderStep(); }
}

function showIneligible(message){
  document.getElementById('progressRow').innerHTML = '';
  document.getElementById('cardArea').innerHTML = `
    <div class="success">
      <div class="icon">–</div>
      <h2>نعتذر</h2>
      <p>${message}</p>
    </div>`;
}

async function nextCandidateNumber(gender){
  const prefix = gender === 'رجل' ? 'ر' : 'س';
  const n = 1000 + Math.floor(Math.random()*9000);
  return prefix + '-' + n;
}

function calcAge(dobStr){
  if(!dobStr) return '';
  const dob = new Date(dobStr);
  if(isNaN(dob)) return '';
  const diff = Date.now() - dob.getTime();
  return Math.floor(diff / (1000*60*60*24*365.25));
}

const CARD_ORDER = ['maritalStatus','hasKids','kidsCount','kidsAges','residenceCity','height','weight','skinTone','educationLevel','jobStatus','educationMajor','jobTitle','commitment','appearance','beard','familyMixing','smoking','exercise','personalityDesc','hobbies','marriageGoal','partnerMaritalAccepted','partnerAgeRange','wantsKids','wifeWorkOk','workAfterMarriage','partnerHasKidsOk','partnerCommitment','timeline'];

function buildCardRows(){
  const rows = [];
  const age = calcAge(answers.dob);
  if(age) rows.push(['العمر', age + ' سنة']);
  const fieldById = {};
  steps.forEach(step=> step.fields.forEach(f=> fieldById[f.id]=f));
  CARD_ORDER.forEach(fid=>{
    if(fid === 'partnerAgeRange'){
      const min = answers.partnerAgeMin, max = answers.partnerAgeMax;
      if(min || max) rows.push(['العمر المفضل للشريك/ة', 'من ' + (min||'؟') + ' إلى ' + (max||'؟')]);
      return;
    }
    const f = fieldById[fid];
    if(!f || !f.onCard) return;
    if(!evalCondition(f.showIf)) return;
    const v = answers[fid];
    if(v === undefined || v === null || v === '') return;
    if(fid === 'hasKids' && v !== 'نعم') return;
    const label = typeof f.cardLabel === 'function' ? f.cardLabel() : (f.cardLabel || f.label);
    rows.push([label, Array.isArray(v) ? v.join('، ') : v]);
  });
  return rows;
}

async function submitForm(){
  const card = document.getElementById('cardArea');
  if(previewMode){
    document.getElementById('progressRow').querySelectorAll('.progress-seg i').forEach(b=>b.style.width='100%');
    card.innerHTML = `
      <div class="success">
        <div class="icon">✓</div>
        <h2>هذه نهاية النموذج</h2>
        <p>وضع المعاينة مفعّل، لذا لم يتم حفظ أي بيانات. أوقفي وضع المعاينة من الأعلى لتجربة التعبئة والإرسال الفعلي.</p>
      </div>`;
    return;
  }
  card.innerHTML = `<div class="success"><div class="icon">…</div><p>جاري إرسال طلبك...</p></div>`;
  const id = 'sub_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
  const candidateNumber = await nextCandidateNumber(answers.gender);
  const flat = {};
  Object.keys(answers).forEach(k=>{
    flat[k] = Array.isArray(answers[k]) ? answers[k].join('، ') : answers[k];
  });
  const record = { id, candidateNumber, submittedAt: new Date().toISOString(), ...flat };
  let sent = false;
  try{
    await fetch(SCRIPT_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(record)});
    sent = true;
  }catch(err){ console.error('send error', err); }
  if(!sent){
    card.innerHTML = `<div class="success"><div class="icon">!</div><h2>تعذّر الإرسال</h2><p>تأكد من اتصالك بالإنترنت ثم حاول مرة أخرى. لم تُفقد إجاباتك.</p><button class="btn-next" id="retrySend">إعادة المحاولة</button></div>`;
    document.getElementById('retrySend').addEventListener('click', submitForm);
    return;
  }
  document.getElementById('progressRow').querySelectorAll('.progress-seg i').forEach(b=>b.style.width='100%');
  const rows = buildCardRows();
  card.innerHTML = `
    <div class="success">
      <div class="icon">✓</div>
      <h2>تم استلام طلبك</h2>
      <p>شكرًا لثقتك في بيوت جدة. هذي بطاقتك التعريفية — بنفس هذا الشكل بالضبط راح تُعرض على المرشح المناسب لك لاحقًا، برقمك فقط بدون اسمك أو رقم جوالك، وبعد أخذ موافقتك على كل حالة.</p>
    </div>
    <div class="id-card">
      <div class="num">${candidateNumber}</div>
      ${rows.map(r => `<div class="row"><span>${r[0]}</span><span>${r[1]}</span></div>`).join('')}
    </div>`;
}

let introIndex = 0;

function renderIntro(){
  document.getElementById('introContent').innerHTML = introPages[introIndex];
  const prog = document.getElementById('introProgress');
  prog.innerHTML = '';
  introPages.forEach((p,i)=>{
    const seg = document.createElement('div');
    seg.className = 'progress-seg';
    const bar = document.createElement('i');
    bar.style.width = i <= introIndex ? '100%' : '0%';
    seg.appendChild(bar);
    prog.appendChild(seg);
  });
  const nav = document.getElementById('introNav');
  const isLast = introIndex === introPages.length - 1;
  nav.innerHTML = `
    ${introIndex>0 ? `<button class="btn-back" id="introBack">رجوع</button>` : `<span></span>`}
    <button class="btn-next" id="introNext">${isLast ? 'ابدأ التسجيل' : 'التالي'}</button>`;
  document.getElementById('introNext').addEventListener('click', ()=>{
    if(isLast){
      document.getElementById('introCard').style.display = 'none';
      document.getElementById('formWrap').style.display = 'block';
      renderStep();
    } else {
      introIndex++; renderIntro();
    }
  });
  const back = document.getElementById('introBack');
  if(back) back.addEventListener('click', ()=>{ introIndex--; renderIntro(); });
}
renderIntro();
